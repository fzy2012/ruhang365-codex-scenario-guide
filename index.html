<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="搜索 Codex 使用手册、官方更新与场景解决方案。" />
    <title>Codex 场景导航器</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="Codex 场景导航器首页"><span>Codex</span> 场景导航器</a>
      <a class="help-link" href="#starter">使用说明</a>
    </header>
    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title">想用 Codex 做什么？从这里开始。</h1>
        <p>搜索功能、问题或场景，找到一个可以直接照着做的答案。</p>
        <form id="search-form" role="search">
          <label class="sr-only" for="search-input">搜索功能、问题或场景</label>
          <div class="search-box">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
            <input id="search-input" autocomplete="off" placeholder="例如：怎么选择 Chat 或 Work、修改网站、任务卡住了" />
            <button type="submit" disabled>正在加载…</button>
          </div>
          <p>搜索只在当前页面本地完成，不会把输入发送给模型。</p>
        </form>
      </section>
      <nav id="content-filters" class="filters" aria-label="内容类型">
        <button class="active" type="button" data-filter="all" aria-pressed="true">全部</button>
        <button type="button" data-filter="manual" aria-pressed="false">使用手册</button>
        <button type="button" data-filter="update" aria-pressed="false">最近更新</button>
        <button type="button" data-filter="solution" aria-pressed="false">场景解决方案</button>
      </nav>
      <div class="content-layout">
        <section class="results" aria-labelledby="results-title">
          <div class="results-heading">
            <div><h2 id="results-title">全部内容</h2><p id="results-count" aria-live="polite">正在加载内容…</p></div>
            <button id="clear-search" type="button" hidden>清除搜索</button>
          </div>
          <div id="content-list" class="content-list" aria-live="polite"></div>
        </section>
        <aside class="side-rail" aria-label="推荐阅读">
          <section id="starter"><h2>新手先看</h2><ol id="starter-list"></ol></section>
          <section><h2>最近更新</h2><div id="update-list"></div><button type="button" class="text-button" data-set-filter="update">查看全部更新</button></section>
          <p class="review-note">只有人工核验、状态为 published 的内容才会在这里出现。</p>
        </aside>
      </div>
    </main>
    <footer>
      <p>内容由本项目维护，功能事实以 OpenAI 官方资料为准。</p>
      <a href="https://learn.chatgpt.com/docs/changelog" target="_blank" rel="noreferrer">官方 ChatGPT &amp; Codex Changelog</a>
    </footer>
    <dialog id="content-dialog" aria-labelledby="dialog-title">
      <button id="dialog-close" class="dialog-close" type="button" aria-label="关闭详情"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19" /></svg></button>
      <div id="dialog-content"></div>
    </dialog>
    <script src="app.js" defer></script>
  </body>
</html>
